{% extends "base.html" %}
{% block title %}Something Went Wrong{% endblock %}
{% block content %}
<div class="container my-5 text-center">
    <i class="bi bi-exclamation-triangle fs-1 text-danger"></i>
    <h1 class="fw-bold mt-3">Oops!</h1>
    <p class="text-muted">{{ message or "Something went wrong on our end. Please try again." }}</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
